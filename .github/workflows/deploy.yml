name: Deploy demo to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages at the repo root
# (https://<owner>.github.io/verified-crisis-mapper-demo/).
#
# SECURITY: this is a PUBLIC repository. Only public, non-secret connection
# vars may be injected here — Vite bakes every VITE_* var into the client
# bundle, which is served publicly. NEVER add a CMS write token. The demo
# runs read-only against public CMS data; if the read vars are absent it
# falls back to bundled mock data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Optional PUBLIC read vars (set as repo Variables, not Secrets):
        #   VITE_CMS_BASE_URL, VITE_CMS_PROJECT, VITE_CMS_MODEL
        # These are non-confidential (visible in the read requests anyway).
        # No write token — see the security note at the top of this file.
        env:
          VITE_CMS_BASE_URL: ${{ vars.VITE_CMS_BASE_URL }}
          VITE_CMS_PROJECT:  ${{ vars.VITE_CMS_PROJECT }}
          VITE_CMS_MODEL:    ${{ vars.VITE_CMS_MODEL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
