name: Refresh verified-events.json (fusion cron)

# Pulls fresh data from GDACS, Copernicus EMS, and ReliefWeb hourly, runs the
# fusion pipeline, and commits the regenerated public/verified-events.json so
# the deployed dashboard always has recent webhook-sourced events. The push
# triggers deploy.yml to redeploy Pages.
#
# All three source APIs are unauthenticated. No secrets are required.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fusion-cron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh verified-events.json
        run: npm run fusion:static

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- public/verified-events.json; then
            echo 'No changes — skipping commit.'
            exit 0
          fi
          git add public/verified-events.json
          git commit -m "chore(fusion): refresh verified-events.json"
          git push
